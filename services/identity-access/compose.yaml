services:
  identity-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_access
      POSTGRES_USER: identity_access
      POSTGRES_PASSWORD: identity_access_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_access -d identity_access"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-access:
    build: .
    profiles: ["service"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://identity-postgres:5432/identity_access
      DB_USERNAME: identity_access
      DB_PASSWORD: identity_access_local_only
      PLATFORM_BOOTSTRAP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      identity-postgres:
        condition: service_healthy
