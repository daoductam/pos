spring:
  application:
    name: identity-access
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/identity_access}
    username: ${DB_USERNAME:identity_access}
    password: ${DB_PASSWORD:identity_access_local_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  environment: ${APP_ENVIRONMENT:local}
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
  cognito:
    issuer-uri: ${COGNITO_ISSUER_URI:}
    audience: ${COGNITO_AUDIENCE:}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    region: ${AWS_REGION:ap-southeast-1}
  workload:
    authentication-enabled: ${WORKLOAD_AUTHENTICATION_ENABLED:true}
  events:
    publisher: ${EVENT_PUBLISHER:local}
    event-bus-name: ${EVENT_BUS_NAME:pos-local}
    source: ${EVENT_SOURCE:pos.identity-access}
  worker:
    invitation-fixed-delay-ms: ${WORKER_INVITATION_DELAY_MS:5000}
    outbox-fixed-delay-ms: ${WORKER_OUTBOX_DELAY_MS:2000}
    initial-delay-ms: ${WORKER_INITIAL_DELAY_MS:1000}
